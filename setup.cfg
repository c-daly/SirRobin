[importlinter]
root_package = sirrobin

[importlinter:contract:layers]
name = SirRobin one-way layers
type = layers
layers =
    sirrobin.observe
    sirrobin.core
    sirrobin.physics
    sirrobin.numerics

[importlinter:contract:physics-independence]
name = Physics cannot import core or observe
type = forbidden
source_modules =
    sirrobin.physics
forbidden_modules =
    sirrobin.core
    sirrobin.observe

[importlinter:contract:numerics-independence]
name = Numerics is the leaf
type = forbidden
source_modules =
    sirrobin.numerics
forbidden_modules =
    sirrobin.physics
    sirrobin.core
    sirrobin.observe

